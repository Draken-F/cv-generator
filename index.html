<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CV - Clara Moreau</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" id="themecss" href="">
  <style>
    /* style.css */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f9f9f9;
  color: #333;
  line-height: 1.6;
}

#cv-wrapper {
  display: flex;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 30px auto;
  background: white;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  overflow: hidden;
}

.left-side, .right-side {
  padding: 30px;
}

.left-side {
  flex: 3;
  border-right: 1px solid #e0e0e0;
}

.right-side {
  flex: 2;
  text-align: center;
}

h1.name {
  font-size: 2.5em;
  color: #357cc2;
}

h2 {
  font-size: 1.4em;
  margin: 20px 0 10px;
  color: #0582ff;
}

.item {
  margin-bottom: 15px;
}

.date {
  color: #888;
  font-size: 0.9em;
}

.profile-photo-container {
  position: relative;
  display: inline-block;
}

.profile-photo-container img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #3498db;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
}

.change-photo-btn {
  position: absolute;
  bottom: 0;
  right: 0;
  background: #3498db77;
  color: white;
  border-radius: 50%;
  padding: 8px;
  cursor: pointer;
  font-size: 1.2em;
  border: 2px solid white;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

.contact, .skills, .languages {
  margin-top: 30px;
  text-align: left;
}

.skill-bar {
  background: #eee;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 10px;
  height: 10px;
}

.skill-bar div {
  background: #3498db;
  height: 100%;
  width: 0%;
  transition: width 0.5s ease;
}

.language-stars {
  color: #f1c40f;
  font-size: 1.1em;
}

button {
  background-color: #2ecc71;
  color: white;
  padding: 8px 16px;
  border: none;
  margin-left: 10px;
  border-radius: 4px;
  cursor: pointer;
}

button:hover {
  background-color: #75e482b7;
}

@media (max-width: 768px) {
  #cv-wrapper {
    flex-direction: column;
  }
  .left-side, .right-side {
    border: none;
  }
}
  </style>
</head>
<body>
  <div>
    
 
  <div style="padding: 10px;">
    <a href="home.html"><button style="background-color: rgb(255, 0, 0);" id="retour" >--Retour</button></a>
    
  </div>
  <div style="text-align:right; padding: 10px;">
    <input type="file" id="fileInput" accept=".json" style="display:none;" />
    <button onclick="document.getElementById('fileInput').click()">Importer un fichier JSON</button>
    <button id="reset">Reinitialiser le CV</button>
    <!-- Ajoute ce bouton dans la div du haut -->
    <button id="downloadCV">Télécharger le CV</button>
  </div>
 </div>
  <div id="cv-wrapper">

    <div class="left-side">
      <h1 class="name"></h1>
      <h2></h2>

      <section>
        <h2>Profil</h2>
        <p></p>
      </section>

      <section>
        <h2>Expérience</h2>
        <div class="item">
          <h3></h3>
          <p class="date"></p>
          <p></p>
        </div>
        <div class="item">
          <h3></h3>
          <p class="date"></p>
          <p></p>
        </div>
      </section>

      <section>
        <h2>Formation</h2>
        <div class="item">
          <h3></h3>
          <p class="date"></p>
          <p></p>
        </div>
      </section>

      <section>
        <h2>Projets</h2>
        <div class="item">
          <h3></h3>
          <p></p>
        </div>
        <div class="item">
          <h3></h3>
          <p></p>
        </div>
      </section>
    </div>

    <div class="right-side">
      <div class="profile-photo-container">
        <input type="file" id="chargefile" accept="image/*" style="display: none;">
        <br><br>
        <img id="preview" src="" alt="Aperçu de l’image" style="max-width: 300px; display: none;" class="profile-img">
        <label for="imageInput" class="change-photo-btn">📷</label>
      </div>

      <div class="contact">
        <h3></h3>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
      </div>

      <div class="skills">
        <h3></h3>
        <p></p>
        <div class="skill-bar"><div></div></div>

        <p></p>
        <div class="skill-bar"><div></div></div>

        <p></p>
        <div class="skill-bar"><div></div></div>

        <p></p>
        <div class="skill-bar"><div></div></div>
      </div>

      <div class="languages">
        <h3>Langues</h3>
        <p> <span class="language-stars"></span></p>
        <p><span class="language-stars"></span></p>
      </div>
    </div>
  </div>
  
  <script type="module" src="./src/main.js"></script>

</body>
</html>
